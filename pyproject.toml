[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-analyser-agent"
version = "0.1.0"
description = "Transcript-first YouTube analysis with local Ollama and Whisper fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.110",
  "faster-whisper>=1.0",
  "httpx>=0.27",
  "ollama>=0.4",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.29",
  "yt-dlp>=2024.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
youtube-bot = ["bgutil-ytdlp-pot-provider>=2.0.2"]

[project.scripts]
youtube-analyser = "youtube_analyser.cli:main"

[tool.setuptools.packages.find]
include = ["youtube_analyser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
